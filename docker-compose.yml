services:
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    ports: ["6379:6379", "3000:3000"]
    volumes: ["falkordb_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports: ["8501:8501"]
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    depends_on:
      falkordb: {condition: service_healthy}
volumes:
  falkordb_data:
